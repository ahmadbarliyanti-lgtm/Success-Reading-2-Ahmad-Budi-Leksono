.badge{display:inline-block;padding:3px 10px;font:700 12px Orbitron;border:1px solid var(--gd);color:var(--gd)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:80;display:grid;place-items:center;padding:16px;overflow:auto}
.ov .box{background:var(--pn);max-width:900px;width:100%;padding:14px;border:1px solid var(--gd)}

 ${!idOk()?`<div class="card"><p>${t("needid")}</p><button class="btn" data-a="nav" data-v="id">${t("idn")}</button></div>`:!S.start?`<button class="btn" data-a="start">${t("start")}</button>`:""}
 <div class="grid" style="margin-top:16px">${order().map(u=>`<div class="card"><div class="badge">${t("unit")} ${u.n}</div><h3 style="margin:8px 0">${u.t}</h3><p style="margin:0 0 10px;color:var(--mu)">${S.done[u.n]?t("score")+": "+S.done[u.n].p:t("todo")}</p><button class="btn gh sm" data-a="nav" data-v="u${u.n}">▸</button></div>`).join("")}</div>`}
function idH(){const d=S.id,f=(k,l)=>`<label class="f">${t(l)}<input data-i="${k}" value="${E(d[k])}" autocomplete="off"></label>`;
 return`<h1 class="gt">${t("idn")}</h1><div class="card" style="max-width:520px">${f("name","name")}${f("cls","cls")}${f("no","no")}${f("mad","mad")}<p id="im" style="min-height:22px;color:var(--gd)"></p><button class="btn" data-a="saveid">${t("save")}</button></div><p style="color:var(--mu)">${t("dsc")}</p>`}
function chart(v){const w=520,h=200,m=34,max=2.6,min=2,bw=(w-m)/v.length;const mo="JFMAMJJASOND";
 return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:560px"><g font-size="10" fill="var(--mu)">${[2,2.2,2.4,2.6].map(y=>{const py=h-20-(y-min)/(max-min)*(h-34);return`<line x1="${m}" x2="${w}" y1="${py}" y2="${py}" stroke="var(--ln)"/><text x="2" y="${py+3}">${y.toFixed(2)}</text>`}).join("")}</g>${v.map((x,i)=>{const bh=(x-min)/(max-min)*(h-34);return`<rect x="${m+i*bw+4}" y="${h-20-bh}" width="${bw-8}" height="${bh}" fill="${i===3?"var(--rd)":"var(--gd2)"}"/><text x="${m+i*bw+bw/2}" y="${h-6}" font-size="10" text-anchor="middle" fill="var(--mu)">${mo[i]}</text>`}).join("")}</svg>`}
function qH(q,dn){const a=S.ans[q.k],cl=dn?(a===q.c?"ok":"no"):"";const nm=E(q.k);
 return`<div class="q ${cl}"><b>${E(q.q)}</b>${q.o.map(o=>`<label class="opt"><input type="radio" name="${nm}" data-k="${nm}" value="${E(o)}" ${a===o?"checked":""} ${dn||!live()?"disabled":""}>${E(o)}</label>`).join("")}</div>`}
function unitH(u){if(!u)return"";const dn=S.done[u.n],L=lay(u),can=live();
 let h=`<h1 class="gt">${t("unit")} ${u.n} — ${u.t}</h1>`;
 if(!idOk())return h+`<div class="card"><p>${t("needid")}</p><button class="btn" data-a="nav" data-v="id">${t("idn")}</button></div>`;
 if(!S.start)return h+`<div class="card"><p>${t("nostart")}</p><button class="btn" data-a="start">${t("start")}</button></div>`;
 h+=`<div class="card passage">${u.p.map(p=>`<p>${E(p)}</p>`).join("")}${u.ch?chart(u.ch):""}</div>`;
 if(dn)h+=`<div class="card"><h2 class="gt" style="margin:0">${t("score")}: ${dn.p} (${dn.c}/${dn.n})</h2><p>${dn.p>=80?t("pass"):t("fail")}</p>${dn.p>=80?`<button class="btn" data-a="cert" data-u="${u.n}">${t("view")}</button>`:""}</div>`;
 h+=`<div class="card"><h3>${t("v")}</h3><p style="color:var(--mu)">${E(u.v.i)}</p>${L.v.map(q=>qH(q,dn)).join("")}</div><div class="card"><h3>${t("r")}</h3>${L.r.map(q=>qH(q,dn)).join("")}</div>`;
 let i=0;const sm=u.s.t.replace(/\{(\d)\}/g,(m,k)=>{const key=u.n+"|s|"+k,a=S.ans[key];const ok=dn?(a===u.s.a[k]?"ok":"no"):"";
  return`<select data-k="${key}" class="${ok}" ${dn||!can?"disabled":""}><option value="">${t("choose")}</option>${L.b.map(o=>`<option ${a===o?"selected":""}>${E(o)}</option>`).join("")}</select>`});
 h+=`<div class="card"><h3>${t("s")}</h3><p style="color:var(--mu)">${L.b.map(E).join(" · ")}</p><div class="sum">${sm}</div></div>`;
 if(!dn&&can)h+=`<button class="btn" data-a="submit" data-u="${u.n}">${t("submit")}</button>`;return h}
function certSVG(u){const d=S.done[u.n],I=S.id,x=(y,s,sz,fill,w=600,f="Rajdhani")=>`<text x="421" y="${y}" text-anchor="middle" font-family="${f},sans-serif" font-size="${sz}" font-weight="${w}" fill="${fill}">${E(s)}</text>`;
 return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ffc83d"/><stop offset="1" stop-color="#e0101f"/></linearGradient></defs><rect width="842" height="595" fill="#fffaf0"/><rect x="18" y="18" width="806" height="559" fill="none" stroke="url(#g)" stroke-width="8"/><rect x="34" y="34" width="774" height="527" fill="none" stroke="#c88a00" stroke-width="1.5"/><path d="M0 0h140L0 140z" fill="#e0101f" opacity=".9"/><path d="M842 595H702l140-140z" fill="#ffb400"/>
${x(110,"CERTIFICATE OF ACHIEVEMENT",38,"#c8101f",800,"Orbitron")}${x(150,"English Reading Exam · AURUM READ",18,"#8a6a10")}${x(205,"This certificate is proudly presented to",20,"#4a3b3b")}${x(268,I.name.toUpperCase(),40,"#201820",800,"Orbitron")}${x(300,`${t("cls")}: ${I.cls} · ${t("no")}: ${I.no} · ${I.mad}`,18,"#4a3b3b")}
${x(350,`for completing Reading Activity Unit ${u.n}: “${u.t}”`,22,"#201820")}${x(400,`SCORE ${d.p} / 100`,44,"#e0101f",800,"Orbitron")}${x(436,`${d.c} of ${d.n} correct answers`,18,"#4a3b3b")}${x(500,d.d,18,"#4a3b3b")}${x(540,"AURUM READ · Built by Ahmad Budi Leksono",14,"#8a6a10")}</svg>`}
function certH(){const ks=Object.keys(S.done).filter(k=>S.done[k].p>=80);
 return`<h1 class="gt">${t("cert")}</h1>${ks.length?`<div class="grid">${ks.map(k=>`<div class="card"><div class="badge">${t("unit")} ${k}</div><h2 style="margin:8px 0">${S.done[k].p}</h2><button class="btn sm" data-a="cert" data-u="${k}">${t("view")}</button></div>`).join("")}</div>`:`<div class="card"><p>${t("none")}</p></div>`}`}
function showCert(n){const u=U.find(x=>x.n==n),svg=certSVG(u),o=document.createElement("div");o.className="ov";o.id="cv";
 o.innerHTML=`<div class="box"><div class="bar" style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"><button class="btn sm" data-a="print">${t("print")}</button>${DL?`<button class="btn sm" data-a="dl" data-u="${n}">${t("dl")}</button>`:""}<button class="btn gh sm" data-a="xcv">${t("close")}</button></div><div style="background:#fff">${svg}</div></div>`;document.body.appendChild(o)}
function render(){theme();const a=$("#app");a.innerHTML=auth?shellH():loginH()}
function status(){const c=$("#ck");if(!c)return;c.textContent=new Date().toLocaleTimeString("en-GB");
 if(S.start&&!S.over){const l=left();if(l<=0){finish();return}$("#cd").textContent=t("left")+" "+mm(l);$("#cd").classList.toggle("warn",l<300000);const d=$("#cd2");if(d)d.textContent=mm(l)}}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="login"){if($("#lu").value==="admin"&&$("#lp").value==="123"){auth=true;view="dash";render()}else $("#le").textContent=t("bad")}
 else if(a==="lang"){S.lang=S.lang==="id"?"en":"id";sv();render()}
 else if(a==="theme"){S.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";sv();render()}
 else if(a==="nav"){view=b.dataset.v;render()}
 else if(a==="menu")$("#sb").classList.toggle("open");
 else if(a==="lock"){auth=false;render()}
 else if(a==="saveid"){const n={};document.querySelectorAll("[data-i]").forEach(i=>n[i.dataset.i]=i.value.trim());const m=$("#im");
  if(Object.values(n).some(v=>!v)){m.textContent=t("full");return}
  const old=idKey();S.id=n;if(idKey()!==old){S.ans={};S.done={};S.start=0;S.end=0;S.over=false;sv();render();$("#im")&&($("#im").textContent=t("chg"));return}sv();m.textContent=t("saved")}
 else if(a==="start"){if(!idOk()){view="id";render();return}S.start=Date.now();S.end=S.start+40*60000;sv();render()}
 else if(a==="submit"){submit(U.find(u=>u.n==b.dataset.u));render()}
 else if(a==="cert")showCert(b.dataset.u);
 else if(a==="xcv")$("#cv").remove();
 else if(a==="print")window.print();
 else if(a==="dl"&&DL){const u=U.find(x=>x.n==b.dataset.u);try{await DL.save({filename:`certificate_unit${u.n}_${S.id.name.replace(/\W+/g,"_")}.svg`,data:certSVG(u)})}catch(x){}}
});
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(k&&live()){S.ans[k]=e.target.value;sv()}});
["copy","cut","paste","contextmenu","dragstart"].forEach(v=>document.addEventListener(v,e=>e.preventDefault()));
document.addEventListener("selectstart",e=>{if(!/INPUT|SELECT/.test(e.target.tagName||""))e.preventDefault()});
document.addEventListener("keydown",e=>{if(((e.ctrlKey||e.metaKey)&&"cvxaups".includes(e.key.toLowerCase()))||e.key==="F12"||e.key==="PrintScreen")e.preventDefault()});
document.addEventListener("keyup",e=>{if(e.key==="PrintScreen")try{navigator.clipboard.writeText("")}catch(x){}});
(async()=>{try{DL=await window.claude.use("downloads")}catch(e){}})();
if(S.start&&!S.over&&left()<=0){U.forEach(submit);S.over=true;sv()}
render();setInterval(status,1000);status();
</script></body></html>
